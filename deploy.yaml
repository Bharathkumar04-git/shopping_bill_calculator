name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: pytest test_app.py

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: bhxrxth0409
        password: dckr_pat_ndQQeCohkZUGEC5Gj_S4yPTu4FI

    - name: Build and Push Docker Image
      run: |
        IMAGE_TAG=${{ github.sha }}
        docker build -t bhxrxth0409/shopping-calculator:$IMAGE_TAG .
        docker push bhxrxth0409/shopping-calculator:$IMAGE_TAG

    - name: Deploy to Kubernetes
      run: |
        IMAGE_TAG=${{ github.sha }}
        # Dynamically inject the unique image tag into the manifest
        sed -i "s/IMAGE_TAG/$IMAGE_TAG/g" k8s/deployment.yaml
        sed -i "s/bhxrxth0409/bhxrxth0409/g" k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
